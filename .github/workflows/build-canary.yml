name: Publish Canary

on:
  push:
    branches: [main]
    paths:
      - 'application/src-tauri/tauri.conf.json'
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  publish-canary-linux:
    name: Build & Publish for Linux (Ubuntu 20.04)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            wget

      # 🧩 Pin linuxdeploy version to avoid Tauri fetching outdated one
      - name: Pin linuxdeploy version
        run: |
          echo "📦 Pinning linuxdeploy version..."
          TAURI_TOOLKIT_PATH="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLKIT_PATH"
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage \
            -O "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          echo "✅ linuxdeploy pinned successfully at $TAURI_TOOLKIT_PATH"

      - name: Setup Environment & Build
        uses: ./.github/actions/setup-and-build
        with:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

  publish-canary-windows:
    name: Build & Publish for Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Environment & Build
        uses: ./.github/actions/setup-and-build
        with:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
