name: Publish Canary

on:
  push:
    branches: [main]
    paths:
      - 'application/src-tauri/tauri.conf.json'
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  publish-canary-linux:
    name: Build & Publish for Linux (Ubuntu 20.04)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NO_STRIP: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget \
            mold

      # 🧩 Pin linuxdeploy version to avoid Tauri fetching outdated one
      - name: Pin linuxdeploy version
        run: |
          echo "📦 Pinning linuxdeploy version..."
          TAURI_TOOLKIT_PATH="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLKIT_PATH"
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage \
            -O "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLKIT_PATH/linuxdeploy-x86_64.AppImage"
          echo "✅ linuxdeploy pinned successfully at $TAURI_TOOLKIT_PATH"

      - name: Setup Environment & Build
        uses: ./.github/actions/setup-and-build
        with:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          args: '--bundles appimage'

  publish-canary-windows:
    name: Build & Publish for Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Disable Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"

      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Environment & Build
        uses: ./.github/actions/setup-and-build
        with:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
          args: '--bundles msi'

  publish-canary-macos:
    name: Build & Publish for macOS (${{ matrix.target }})
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            args: '--bundles dmg,app --target aarch64-apple-darwin'
          - target: x86_64-apple-darwin
            args: '--bundles dmg,app --target x86_64-apple-darwin'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment & Build
        uses: ./.github/actions/setup-and-build
        with:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          args: ${{ matrix.args }}
