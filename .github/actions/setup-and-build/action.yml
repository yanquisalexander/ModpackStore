# .github/actions/setup-and-build/action.yml

name: 'Setup Environment and Build'
description: 'Sets up Node, Rust, caches dependencies, and runs the Tauri build'

inputs:
  TAURI_SIGNING_PRIVATE_KEY:
    required: true
    description: 'The private key used for signing Tauri applications'
  GITHUB_TOKEN:
    required: true
    description: 'GitHub token for authentication'

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Set up Node.js with pnpm cache
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'pnpm'
        cache-dependency-path: './application/pnpm-lock.yaml'

    - name: Install frontend dependencies
      working-directory: ./application
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './application/src-tauri'
        cache-on-failure: true
        cache-all-crates: true
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # --- PASO DE LIMPIEZA AUTOMÁTICA ---
    - name: Purge old Canary release to free storage
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      shell: bash
      run: |
        echo "Eliminando release y assets antiguos de 'canary'..."
        gh release delete canary --repo ModpackStore/ModpackStore-Releases --yes --cleanup-tag || true
        # Limpieza adicional por si quedan referencias remotas del tag
        git push origin --delete tag canary 2>/dev/null || true

    - name: Build & Publish Canary Release
      uses: tauri-apps/tauri-action@dev
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.TAURI_SIGNING_PRIVATE_KEY }}
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ModpackStore/ModpackStore-Releases
      with:
        projectPath: ./application
        tagName: canary
        releaseName: Canary Build canary
        releaseBody: Automated canary build for testing
        releaseDraft: false
        releaseCommitish: main
        prerelease: false
        includeUpdaterJson: true
        owner: ModpackStore
        repo: ModpackStore-Releases