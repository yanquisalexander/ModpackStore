# .github/actions/setup-and-build/action.yml

name: 'Setup Environment and Build'
description: 'Sets up Node, Rust, caches dependencies, and runs the Tauri build'

inputs:
  TAURI_SIGNING_PRIVATE_KEY:
    required: true
    description: 'The private key used for signing Tauri applications'
  GITHUB_TOKEN:
    required: true
    description: 'GitHub token for authentication'
  PFX_BASE64:
    required: false
    description: 'Base64-encoded PFX certificate for Windows signing'
  PFX_PASSWORD:
    required: false
    description: 'Password for the PFX certificate'

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Set up Node.js with pnpm cache
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'pnpm'
        cache-dependency-path: './application/pnpm-lock.yaml'

    - name: Install frontend dependencies
      working-directory: ./application
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Set Cargo env vars
      shell: bash
      run: |
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_NET_RETRY=3" >> "$GITHUB_ENV"

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install macOS universal target
      if: runner.os == 'macOS'
      shell: bash
      run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

    - name: Set linker flags (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold -C debuginfo=0" >> "$GITHUB_ENV"

    - name: Set linker flags (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld -C debuginfo=0" >> "$GITHUB_ENV"

    - name: Set linker flags (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: echo "RUSTFLAGS=-C debuginfo=0" >> "$GITHUB_ENV"

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './application/src-tauri'
        shared-key: "canary-${{ runner.os }}"
        cache-all-crates: false
        cache-on-failure: false
        save-if: true

    - name: Purge old Canary release to free storage
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      shell: bash
      run: |
        echo "Eliminando release y assets antiguos de 'canary'..."
        gh release delete canary --repo ModpackStore/ModpackStore-Releases --yes --cleanup-tag || true

    - name: Import Windows cert
      shell: powershell
      if: runner.os == 'Windows' && inputs.PFX_BASE64 != ''
      run: |
        $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
        $bytes = [System.Convert]::FromBase64String("${{ inputs.PFX_BASE64 }}")
        [IO.File]::WriteAllBytes($pfxPath, $bytes)
        $pwd = ConvertTo-SecureString -String "${{ inputs.PFX_PASSWORD }}" -Force -AsPlainText
        Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
        
    - name: Build & Publish Canary Release
      uses: tauri-apps/tauri-action@v1
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.TAURI_SIGNING_PRIVATE_KEY }}
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ModpackStore/ModpackStore-Releases
      with:
        projectPath: ./application
        args: ${{ runner.os == 'Linux' && '--bundles appimage' || (runner.os == 'macOS' && '--bundles dmg --target universal-apple-darwin' || '--bundles msi') }}
        tagName: canary
        releaseName: Canary Build canary
        releaseBody: Automated canary build for testing
        releaseDraft: false
        releaseCommitish: main
        prerelease: false
        includeUpdaterJson: true
        owner: ModpackStore
        repo: ModpackStore-Releases