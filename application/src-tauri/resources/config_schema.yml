# Configuración ModpackStore
# Define todos los ajustes disponibles en la aplicación

instancesDir:
  type: path
  default: "~/ModpackStore/Instances"
  description: "Ubicación donde se guardarán todas las instancias de Minecraft"
  ui_section: directories
  validator: directory_exists_or_creatable

javaDir:
  type: path
  default: "$JAVA_HOME"
  description: "Ubicación de la instalación de Java para ejecutar Minecraft"
  ui_section: directories
  validator: directory_exists

language:
  type: language_enum
  default: "es"
  description: "Idioma de la interfaz"
  ui_section: general

closeOnLaunch:
  type: boolean
  default: false
  description: "Cierra el launcher cuando se inicie Minecraft"
  ui_section: gameplay

minimizeOnClose:
  type: boolean
  default: false
  description: "Minimizar a la bandeja del sistema al cerrar la ventana"
  ui_section: general

releaseChannel:
  type: enum
  choices: 
    - canary
  default: "canary"
  description: "Canal de lanzamiento para actualizaciones"
  ui_section: experimental

lastUpdatedAt:
  type: string
  default: ""
  description: "Última fecha de actualización del launcher"
  ui_section: internal

updatedFrom:
  type: string
  default: ""
  description: "Última versión desde la que se actualizó el launcher"
  ui_section: internal

showSnapshots:
  type: boolean
  default: false
  description: "Mostrar versiones de Minecraft Snapshot"
  ui_section: gameplay

firstRunAt:
  type: string
  default: null
  description: "Timestamp de la primera ejecución de la aplicación"
  ui_section: internal

lastChangelogId:
  type: integer
  default: 0
  description: "ID del último changelog mostrado"
  ui_section: internal

ramAllocation:
  type: integer
  default: 2048
  min: 1024
  max: 16384
  description: "Memoria RAM asignada para Minecraft en MB (configurada durante el onboarding)"
  ui_section: gameplay

downloadConcurrency:
  type: slider
  default: 4
  min: 1
  max: 16
  description: "Número de descargas simultáneas para archivos de modpack"
  ui_section: internal

lastReminderTimestamp:
  type: integer
  default: 0
  description: "Timestamp del último recordatorio mostrado"
  ui_section: internal

selectedTheme:
  type: string
  default: "dark"
  description: "Tema seleccionado por el usuario"
  ui_section: internal # We don't show this in the UI, because the Theme Chooser handles it

startWithSystem:
  type: boolean
  default: false
  description: "Iniciar automáticamente con el sistema"
  ui_section: general

startMinimizedToTray:
  type: boolean
  default: false
  description: "Iniciar minimizado en la bandeja del sistema"
  ui_section: general

hotkeysEnabled:
  type: boolean
  default: true
  description: "Habilitar atajos de teclado globales"
  ui_section: hotkeys

hotkeyOpenApp:
  type: hotkey
  default: "Ctrl+Alt+M"
  description: "Atajo para abrir/ocultar la aplicación"
  ui_section: hotkeys

hotkeyToggleOverlay:
  type: hotkey
  default: "Ctrl+Alt+Shift+I"
  description: "Atajo para mostrar/ocultar el overlay de instancias"
  ui_section: hotkeys

hotkeyKillInstance:
  type: hotkey
  default: "Ctrl+Alt+Shift+X"
  description: "Atajo para forzar cierre de instancia activa"
  ui_section: hotkeys

developerMode:
  type: boolean
  default: false
  description: "Activar modo desarrollador y sección Flags"
  ui_section: internal

enableExtendedSidebar:
  type: boolean
  default: false
  description: "Extiende el sidebar lateral con información adicional de instancias"
  ui_section: experimental
